// Set text based on language
function setLanguage(lang){
  const t = translations[lang] || translations['en'];
  document.getElementById('note').textContent = t.note;
  document.getElementById('line1').textContent = t.line1;
  document.getElementById('line2').textContent = t.line2;
  document.getElementById('payment').textContent = t.payment;
  document.getElementById('line3').textContent = t.line3;
  document.getElementById('langLabel').textContent = t.selectLang;
}

// Auto-detect browser language
window.onload = function(){
  let lang = navigator.language.slice(0,2);
  if(!translations[lang]) lang = 'en';
  setLanguage(lang);
};
</script>
</head>
<body>

<div class="note" id="note"></div>

<h3 id="line1"></h3>
<h3 id="line2"></h3>
<h3 id="payment" class="payment-instruction"></h3>
<h3 id="line3"></h3>

<!-- Language Selector -->
<div class="language-selector">
  <label id="langLabel" for="lang"></label>
  <select id="lang" onchange="setLanguage(this.value)">
    <option value="en">English</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
    <option value="pt">Portuguese</option>
    <option value="fr">French</option>
    <option value="it">Italian</option>
    <option value="pl">Polish</option>
    <option value="zh">Chinese</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="nl">Dutch</option>
    <option value="ro">Romanian</option>
  </select>
</div>

</body>
