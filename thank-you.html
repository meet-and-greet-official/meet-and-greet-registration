<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You - Meet & Greet Registration</title>
<style>
body { font-family: Arial, sans-serif; margin:20px; background:#fff; color:#000; text-align:center; }
h1 { font-size:28px; font-weight:bold; margin-bottom:20px; color:#000; }
p { font-size:18px; margin-bottom:15px; }
.language-selector { margin-bottom:20px; }
</style>
<script>
const thankTranslations = {
  en: { message1:"Thank you! Your Meet & Greet details have been submitted successfully.", message2:"Please proceed to make your payment.", message3:"See you at the event! 🎉" },
  de: { message1:"Danke! Ihre Meet & Greet-Daten wurden erfolgreich übermittelt.", message2:"Bitte fahren Sie mit der Zahlung fort.", message3:"Wir sehen uns bei der Veranstaltung! 🎉" },
  es: { message1:"¡Gracias! Sus detalles de Meet & Greet han sido enviados con éxito.", message2:"Por favor, proceda a realizar su pago.", message3:"¡Nos vemos en el evento! 🎉" },
  it: { message1:"Grazie! I tuoi dettagli del Meet & Greet sono stati inviati con successo.", message2:"Procedi al pagamento.", message3:"Ci vediamo all'evento! 🎉" },
  fr: { message1:"Merci ! Vos informations pour le Meet & Greet ont été soumises avec succès.", message2:"Veuillez procéder au paiement.", message3:"À bientôt à l'événement ! 🎉" },
  pl: { message1:"Dziękujemy! Twoje dane Meet & Greet zostały pomyślnie przesłane.", message2:"Proszę przystąpić do płatności.", message3:"Do zobaczenia na wydarzeniu! 🎉" },
  zh: { message1:"感谢！您的 Meet & Greet 详细信息已成功提交。", message2:"请继续进行付款。", message3:"活动见！🎉" },
  ja: { message1:"ありがとうございます！Meet & Greet の詳細が正常に送信されました。", message2:"お支払いを続行してください。", message3:"イベントでお会いしましょう！🎉" },
  ko: { message1:"감사합니다! Meet & Greet 정보가 성공적으로 제출되었습니다.", message2:"결제를 진행해주세요.", message3:"이벤트에서 뵙겠습니다! 🎉" },
  nl: { message1:"Bedankt! Uw Meet & Greet-gegevens zijn succesvol verzonden.", message2:"Ga verder met uw betaling.", message3:"Tot ziens op het evenement! 🎉" },
  ro: { message1:"Mulțumim! Detaliile Meet & Greet au fost trimise cu succes.", message2:"Vă rugăm să efectuați plata.", message3:"Ne vedem la eveniment! 🎉" },
  pt: { message1:"Obrigado! Seus detalhes do Meet & Greet foram enviados com sucesso.", message2:"Por favor, prossiga com o pagamento.", message3:"Vejo você no evento! 🎉" }
};

function changeLanguage(lang){
  document.getElementById('msg1').textContent = thankTranslations[lang].message1;
  document.getElementById('msg2').textContent = thankTranslations[lang].message2;
  document.getElementById('msg3').textContent = thankTranslations[lang].message3;
}
</script>
</head>
<body>

<h1>Meet & Greet Registration</h1>

<div class="language-selector">
  <label for="lang">Select Language:</label>
  <select id="lang" onchange="changeLanguage(this.value)">
    <option value="en" selected>English</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
    <option value="it">Italian</option>
    <option value="fr">French</option>
    <option value="pl">Polish</option>
    <option value="zh">Chinese</option>
    <option value="ja">Japanese</option>
    <option value="ko">Korean</option>
    <option value="nl">Dutch</option>
    <option value="ro">Romanian</option>
    <option value="pt">Portuguese (Brazil)</option>
  </select>
</div>

<p id="msg1">Thank you! Your Meet & Greet details have been submitted successfully.</p>
<p id="msg2">Please proceed to make your payment.</p>
<p id="msg3">See you at the event! 🎉</p>

</body>
</html>
