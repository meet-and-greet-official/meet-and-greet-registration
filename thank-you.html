<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    text-align: center;
    background-color: #fff;
    color: #000;
}
h3 {
    font-weight: bold;
    margin-bottom: 15px;
}
.payment-instruction {
    color: red;
    font-weight: bold;
    margin-bottom: 20px;
}
.language-selector {
    margin-top: 20px;
}
</style>
<script>
// Translations
const translations = {
  en: {
    line1: "Thank you! We’ve received your Meet & Greet registration details.",
    line2: "Your registration has been submitted successfully.",
    payment: "Please proceed to make your payment.",
    line3: "See you at the event! 🎉"
  },
  de: {
    line1: "Danke! Wir haben Ihre Meet & Greet-Registrierungsdetails erhalten.",
    line2: "Ihre Registrierung wurde erfolgreich übermittelt.",
    payment: "Bitte fahren Sie mit der Zahlung fort.",
    line3: "Wir sehen uns bei der Veranstaltung! 🎉"
  },
  es: {
    line1: "¡Gracias! Hemos recibido los detalles de su registro para Meet & Greet.",
    line2: "Su registro se ha enviado con éxito.",
    payment: "Por favor, proceda a realizar su pago.",
    line3: "¡Nos vemos en el evento! 🎉"
  },
  pt: {
    line1: "Obrigado! Recebemos os detalhes da sua inscrição no Meet & Greet.",
    line2: "Sua inscrição foi enviada com sucesso.",
    payment: "Por favor, prossiga para efetuar o pagamento.",
    line3: "Nos vemos no evento! 🎉"
  },
  fr: {
    line1: "Merci ! Nous avons reçu les détails de votre inscription au Meet & Greet.",
    line2: "Votre inscription a été soumise avec succès.",
    payment: "Veuillez procéder au paiement.",
    line3: "À bientôt à l'événement ! 🎉"
  },
  it: {
    line1: "Grazie! Abbiamo ricevuto i dettagli della tua registrazione al Meet & Greet.",
    line2: "La tua registrazione è stata inviata con successo.",
    payment: "Si prega di procedere al pagamento.",
    line3: "Ci vediamo all'evento! 🎉"
  },
  pl: {
    line1: "Dziękujemy! Otrzymaliśmy szczegóły rejestracji na Meet & Greet.",
    line2: "Twoja rejestracja została pomyślnie przesłana.",
    payment: "Proszę przystąpić do dokonania płatności.",
    line3: "Do zobaczenia na wydarzeniu! 🎉"
  },
  zh: {
    line1: "谢谢！我们已收到您的Meet & Greet注册信息。",
    line2: "您的注册已成功提交。",
    payment: "请继续进行付款。",
    line3: "活动见！🎉"
  },
  ja: {
    line1: "ありがとうございます！Meet & Greet の登録情報を受け取りました。",
    line2: "登録が正常に送信されました。",
    payment: "お支払いを続行してください。",
    line3: "イベントでお会いしましょう！🎉"
  },
  ko: {
    line1: "감사합니다! Meet & Greet 등록 정보를 받았습니다.",
    line2: "등록이 성공적으로 제출되었습니다.",
    payment: "결제를 진행해 주세요.",
    line3: "행사장에서 뵙겠습니다! 🎉"
  },
  nl: {
    line1: "Dank je! We hebben je Meet & Greet-registratiegegevens ontvangen.",
    line2: "Je registratie is succesvol ingediend.",
    payment: "Ga alstublieft verder met de betaling.",
    line3: "Tot ziens op het evenement! 🎉"
  },
  ro: {
    line1: "Mulțumim! Am primit detaliile înregistrării tale pentru Meet & Greet.",
    line2: "Înregistrarea ta a fost trimisă cu succes.",
    payment: "Vă rugăm să continuați cu plata.",
    line3: "Ne vedem la eveniment! 🎉"
  }
};

// Set text based on language
function setLanguage(lang){
  const t = translations[lang] || translations['en'];
  document.getElementById('line1').textContent = t.line1;
  document.getElementById('line2').textContent = t.line2;
  document.getElementById('payment').textContent = t.payment;
  document.getElementById('line3').textContent = t.line3;
}

// Auto-detect browser language
window.onload = function(){
  let lang = navigator.language.slice(0,2);
  if(!translations[lang]) lang = 'en';
  setLanguage(lang);
};
</script>
</head>
<body>

<h3 id="line1">Thank you! We’ve received your Meet & Greet registration details.</h3>
<h3 id="line2">Your registration has been submitted successfully.</h3>
<h3 id="payment" class="payment-instruction">Please proceed to make your payment.</h3>
<h3 id="line3">See you at the event! 🎉</h3>

</body>
</html>
